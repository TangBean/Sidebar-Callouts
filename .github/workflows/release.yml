name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Build plugin
              run: |
                  npm ci
                  npm run lint
                  npm run build
                  npm test

            - name: Validate release version
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  node --input-type=module <<'NODE'
                  import assert from 'node:assert/strict';
                  import { readFileSync } from 'node:fs';
                  const read = (file) => JSON.parse(readFileSync(file, 'utf8'));
                  const manifest = read('manifest.json');
                  const pkg = read('package.json');
                  const lock = read('package-lock.json');
                  const versions = read('versions.json');
                  assert.match(manifest.version, /^\d+\.\d+\.\d+$/);
                  assert.equal(process.env.RELEASE_TAG, manifest.version, 'Tag must match manifest.version without a v prefix');
                  assert.equal(pkg.version, manifest.version, 'package.json version mismatch');
                  assert.equal(lock.version, manifest.version, 'package-lock.json version mismatch');
                  assert.equal(lock.packages[''].version, manifest.version, 'Lockfile root package version mismatch');
                  assert.equal(versions[manifest.version], manifest.minAppVersion, 'versions.json compatibility mismatch');
                  NODE

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --draft \
                    main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
